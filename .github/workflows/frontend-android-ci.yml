name: Frontend Android CI

on:
  push:
    branches: [feature/kotlin-native-frontend]
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle/actions/setup-gradle: caching bawaan untuk dependency & wrapper
      # distribution supaya build berikutnya lebih cepat, tetap memakai
      # ./gradlew yang sudah di-commit (bukan menggantikannya).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: frontend

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: frontend

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        working-directory: frontend
