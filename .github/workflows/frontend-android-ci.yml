name: Frontend Android CI

on:
  push:
    branches: [feature/kotlin-native-frontend]
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Repo ini belum menyertakan Gradle Wrapper (gradle-wrapper.jar) karena file
      # biner tersebut perlu digenerate dari mesin ber-Gradle (`gradle wrapper`).
      # Sebagai gantinya, action ini yang menyediakan Gradle langsung di runner,
      # jadi build tetap berjalan tanpa wrapper. Setelah gradlew digenerate dan
      # dicommit, langkah "Setup Gradle" + panggilan "gradle" di bawah bisa
      # diganti kembali ke "./gradlew".
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: frontend

      - name: Run unit tests
        run: gradle testDebugUnitTest
        working-directory: frontend
