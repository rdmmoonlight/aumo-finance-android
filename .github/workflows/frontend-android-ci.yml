name: Frontend Android CI

on:
  push:
    branches: [main, feature/kotlin-native-frontend]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'

permissions:
  contents: write # Diperlukan agar bot bisa melakukan push commit baru

jobs:
  lint-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Menggunakan token bawaan agar action dapat melakukan push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Jalankan Auto-fix Ktlint
      - name: Auto-fix Kotlin style
        run: ./gradlew ktlintFormat --continue
        continue-on-error: true

      # 2. Commit dan push otomatis jika ada file yang diubah oleh ktlintFormat
      - name: Commit auto-fix changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: auto-fix Kotlin code style [skip ci]'

      # 3. Jalankan Android Lint (pemeriksaan potensi bug & struktur Android)
      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace
        
