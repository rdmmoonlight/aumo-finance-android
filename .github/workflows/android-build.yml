name: Android Build (Kotlin native)

# Menggantikan production-pipeline.yml lama (build+sign APK .NET MAUI).
# Hasil akhirnya SATU APK: release, signed, siap install/rilis — bukan
# beberapa artifact (debug/unsigned/signed) seperti versi sebelumnya.
on:
  push:
    branches: [main, feature/kotlin-native-frontend]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-release:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: frontend

      # PENTING: github.run_number itu PER-WORKFLOW, bukan global per-repo.
      # Baca tag rilis GitHub TERAKHIR yang benar-benar sudah dipublikasikan
      # (dari workflow manapun), lalu naikkan build number-nya kalau masih
      # di bulan yang sama, atau mulai dari 1 kalau sudah beda bulan (format
      # CalVer yy.M.N tetap lebih besar begitu M naik) — supaya auto-updater
      # (Services/UpdateService.cs) selalu menganggap ini versi lebih baru.
      - name: Generate CalVer version (lanjutan dari rilis GitHub terakhir)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR_MONTH=$(date +'%y.%-m')
          LATEST_TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || echo "")
          LATEST_VERSION="${LATEST_TAG#v}"

          if [ -n "$LATEST_VERSION" ]; then
            LATEST_YEAR_MONTH=$(echo "$LATEST_VERSION" | cut -d. -f1-2)
            LATEST_BUILD=$(echo "$LATEST_VERSION" | cut -d. -f3)
          else
            LATEST_YEAR_MONTH=""
            LATEST_BUILD="0"
          fi

          if [ "$YEAR_MONTH" = "$LATEST_YEAR_MONTH" ]; then
            NEW_BUILD=$((LATEST_BUILD + 1))
          else
            NEW_BUILD=1
          fi

          APP_VERSION="${YEAR_MONTH}.${NEW_BUILD}"
          echo "Rilis terakhir: ${LATEST_TAG:-<tidak ada>} -> versi baru: v${APP_VERSION}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

          # versionCode Android: integer, harus tetap naik walau lintas bulan/
          # tahun. Dipakai jumlah menit sejak epoch tetap 2026-01-01 UTC:
          # selalu naik monoton per menit, jauh di bawah batas maksimum
          # Android (2.100.000.000).
          EPOCH_MINUTES=$(( ( $(date -u +%s) - $(date -u -d '2026-01-01T00:00:00Z' +%s) ) / 60 ))
          echo "version_code=$EPOCH_MINUTES" >> "$GITHUB_OUTPUT"

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace -PappVersionName=${{ steps.version.outputs.app_version }} -PappVersionCode=${{ steps.version.outputs.version_code }}
        working-directory: frontend

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # printf + tr -d '[:space:]' membuang whitespace/newline yang bisa
          # nyangkut di secret base64 sebelum decode — PKCS12 (.jks) adalah
          # blob biner terenkripsi, korupsi sedikit saja bisa menghasilkan
          # "keystore password was incorrect" walau password sebenarnya benar.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > release-key.jks

      - name: Zipalign & sign APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED_APK=$(find frontend/app/build/outputs/apk/release -name '*.apk' | head -1)
          "$BUILD_TOOLS/zipalign" -p 4 "$UNSIGNED_APK" aligned-release.apk

          # PENTING: file ini format PKCS12 — tidak mendukung key-password
          # beda dari store-password seperti format JKS lama. Pakai
          # KEYSTORE_PASSWORD untuk --ks-pass MAUPUN --key-pass.
          "$BUILD_TOOLS/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out aumo-release-signed.apk \
            aligned-release.apk

      - name: Bersihkan file keystore
        if: always()
        run: rm -f release-key.jks

      - name: Upload APK signed (satu-satunya artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aumo-release-signed-v${{ steps.version.outputs.app_version }}
          path: aumo-release-signed.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_version }}
          name: Aumo Release v${{ steps.version.outputs.app_version }}
          body: "Rilisan otomatis build ke-${{ github.run_number }}."
          files: aumo-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
