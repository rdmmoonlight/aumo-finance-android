name: Android Build (Kotlin native)

# Menggantikan production-pipeline.yml lama (build+sign APK .NET MAUI).
# Untuk saat ini di-scope ke branch feature/kotlin-native-frontend saja —
# belum ke 'production', sampai migrasi ini benar-benar siap dirilis.
on:
  push:
    branches: [feature/kotlin-native-frontend]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (debug + release unsigned)
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: frontend

      # PENTING: github.run_number itu PER-WORKFLOW, bukan global per-repo.
      # Workflow lama (production-pipeline.yml, MAUI) sudah jalan 200+ kali
      # dan APK terakhirnya (versionName "26.8.210" per histori run) sudah
      # terpasang di HP pengguna. Kalau versi di sini dihitung dari
      # github.run_number workflow INI SAJA (baru mulai dari 1), hasilnya akan
      # lebih RENDAH dari yang sudah terpasang, dan auto-updater (yang
      # membandingkan tag rilis GitHub terhadap AppInfo.Current.VersionString
      # di app lama — lihat Services/UpdateService.cs branch production) tidak
      # akan pernah menganggap ini versi baru.
      #
      # Solusi robust: baca tag rilis GitHub TERAKHIR yang benar-benar sudah
      # dipublikasikan (dari workflow manapun), lalu naikkan build number-nya
      # kalau masih di bulan yang sama, atau mulai dari 1 kalau sudah beda
      # bulan (format CalVer yy.M.N tetap lebih besar begitu M naik).
      - name: Generate CalVer version (lanjutan dari rilis GitHub terakhir)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR_MONTH=$(date +'%y.%-m')
          LATEST_TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || echo "")
          LATEST_VERSION="${LATEST_TAG#v}"

          if [ -n "$LATEST_VERSION" ]; then
            LATEST_YEAR_MONTH=$(echo "$LATEST_VERSION" | cut -d. -f1-2)
            LATEST_BUILD=$(echo "$LATEST_VERSION" | cut -d. -f3)
          else
            LATEST_YEAR_MONTH=""
            LATEST_BUILD="0"
          fi

          if [ "$YEAR_MONTH" = "$LATEST_YEAR_MONTH" ]; then
            NEW_BUILD=$((LATEST_BUILD + 1))
          else
            NEW_BUILD=1
          fi

          APP_VERSION="${YEAR_MONTH}.${NEW_BUILD}"
          echo "Rilis terakhir: ${LATEST_TAG:-<tidak ada>} -> versi baru: v${APP_VERSION}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

          # versionCode Android: integer, harus tetap naik walau lintas bulan/
          # tahun — dipakai jam saat build (yy+mm+dd+HH) supaya monoton tanpa
          # bergantung pada riwayat run_number workflow tertentu.
          # versionCode Android: integer, harus tetap naik walau lintas bulan/
          # tahun. Skema "yymmddHH" (8 digit, presisi jam) berisiko bentrok
          # kalau build lebih dari sekali dalam jam yang sama — diganti jumlah
          # menit sejak epoch tetap 2026-01-01 UTC: selalu naik monoton per
          # menit, dan jauh di bawah batas maksimum Android (2.100.000.000).
          EPOCH_MINUTES=$(( ( $(date -u +%s) - $(date -u -d '2026-01-01T00:00:00Z' +%s) ) / 60 ))
          echo "version_code=$EPOCH_MINUTES" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace -PappVersionName=${{ steps.version.outputs.app_version }} -PappVersionCode=${{ steps.version.outputs.version_code }}
        working-directory: frontend

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace -PappVersionName=${{ steps.version.outputs.app_version }} -PappVersionCode=${{ steps.version.outputs.version_code }}
        working-directory: frontend

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        working-directory: frontend

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aumo-debug-v${{ steps.version.outputs.app_version }}
          path: frontend/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: aumo-release-unsigned-v${{ steps.version.outputs.app_version }}
          path: frontend/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  sign-and-release:
    name: Sign & Publish Release
    needs: build
    runs-on: ubuntu-latest
    # 4 secret keystore sudah dikonfirmasi ada — jalan otomatis di setiap push,
    # bukan cuma manual lagi. Guard "configured" di bawah tetap dipertahankan
    # sebagai jaring pengaman kalau suatu saat secret ini kosong/berubah.
    permissions:
      contents: write
    steps:
      - name: Cek apakah secret keystore sudah dikonfigurasi
        id: check_secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lewati signing (secret belum di-set)
        if: steps.check_secret.outputs.configured == 'false'
        run: |
          echo "Secret ANDROID_KEYSTORE_BASE64 belum di-set di repo ini."
          echo "APK debug & release unsigned tetap tersedia di artifact job 'build' di atas."
          echo "Untuk mengaktifkan signing otomatis, set secret: ANDROID_KEYSTORE_BASE64,"
          echo "ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD."

      - name: Download unsigned release APK
        if: steps.check_secret.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aumo-release-unsigned-v${{ needs.build.outputs.app_version }}
          path: release-assets

      - name: Decode keystore
        if: steps.check_secret.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # PENTING: production-pipeline.yml (MAUI) lama memanggil .Trim() di
          # PowerShell sebelum FromBase64String() — bash saya sebelumnya TIDAK
          # membuang whitespace/newline dari secret sebelum decode. Kalau
          # secret ini punya newline nyangkut (umum terjadi saat copy-paste
          # base64 ke GitHub Secrets), hasil decode jadi sedikit korup —
          # PKCS12 (.jks) adalah blob biner terenkripsi, korupsi sedikit saja
          # persis menghasilkan "keystore password was incorrect" /
          # BadPaddingException walau password sebenarnya benar. tr -d
          # menghapus SEMUA whitespace (aman, alfabet base64 valid tidak
          # pernah mengandung whitespace).
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > release-key.jks
          echo "Ukuran file keystore hasil decode: $(wc -c < release-key.jks) bytes"

      - name: Verifikasi keystore & alias bisa dibuka (isolasi masalah dari apksigner)
        if: steps.check_secret.outputs.configured == 'true'
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore release-key.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | head -5

      - name: Zipalign & sign APK
        if: steps.check_secret.outputs.configured == 'true'
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED_APK=$(find release-assets -name '*.apk' | head -1)
          "$BUILD_TOOLS/zipalign" -p 4 "$UNSIGNED_APK" aligned-release.apk

          # PENTING: file ini format PKCS12 (dikonfirmasi dari stack trace
          # PKCS12KeyStore.engineLoad di error sebelumnya). PKCS12 TIDAK
          # mendukung key-password yang beda dari store-password seperti
          # format JKS lama — satu-satunya password yang benar-benar berlaku
          # adalah store password. "keytool -list" di step sebelumnya lolos
          # pakai storepass saja (tidak butuh keypass terpisah). Fix: pakai
          # KEYSTORE_PASSWORD untuk keduanya (--ks-pass MAUPUN --key-pass),
          # sesuai konstrain PKCS12.
          "$BUILD_TOOLS/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out aumo-release-signed.apk \
            aligned-release.apk

      - name: Bersihkan file keystore
        if: always()
        run: rm -f release-key.jks

      - name: Upload signed APK
        if: steps.check_secret.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aumo-release-signed-v${{ needs.build.outputs.app_version }}
          path: aumo-release-signed.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.check_secret.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.app_version }}
          name: Aumo Release v${{ needs.build.outputs.app_version }}
          body: "Rilisan otomatis build ke-${{ github.run_number }} dari feature/kotlin-native-frontend."
          files: aumo-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
