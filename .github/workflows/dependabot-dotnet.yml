name: Dependabot NuGet Update Check

on:
  schedule:
    - cron: '0 2 * * 1' # Berjalan setiap hari Senin jam 02:00 UTC
  workflow_dispatch:

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Run Dotnet Restore (Verify packages)
        run: dotnet restore ./AumoFinance.csproj
