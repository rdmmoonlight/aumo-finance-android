name: Backend .NET CI

on:
  push:
    branches: [feature/kotlin-native-frontend]
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: backend/AumoFinance.Api

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend/AumoFinance.Api
