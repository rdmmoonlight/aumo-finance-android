name: Production Pipeline (Lint & Build APK)

on:
  push:
    branches:
      - production

jobs:
  # ==============================================================
  # JOB 1: CHECK CODE QUALITY, AUTO-FIX & COMMIT
  # ==============================================================
  lint-csharp:
    name: Auto-Fix Lint & Verify C# Code
    runs-on: windows-latest

    permissions:
      contents: write # Izin WAJIB agar bot bisa push commit auto-fix

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # 2. Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # 3. Install Workload MAUI Android
      - name: Install Workloads
        run: dotnet workload install maui-android

      # 4. Restore Dependencies
      - name: Restore Dependencies
        run: dotnet restore

      # 5. Auto-Fix Format Kode (Perbaiki whitespace dan indentasi otomatis)
      - name: Auto-Fix Code Formatting
        run: dotnet format

      # 6. Commit dan Push Perubahan Format (Jika ada yang berubah)
      - name: Commit and Push Format Changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          $status = git status --porcelain
          if ($status) {
            Write-Host "Menemukan file yang tidak rapi. Melakukan auto-commit..."
            git add .
            git commit -m "style: auto-fix C# code formatting [skip ci]"
            git push origin HEAD:production
          } else {
            Write-Host "Semua kode sudah rapi. Tidak ada perubahan."
          }

      # 7. Static Analysis (Gagal jika ada Warning/Error logika pada kodingan)
      - name: Run Static Code Analysis
        run: dotnet build --no-restore -c Debug /p:TreatWarningsAsErrors=true

  # ==============================================================
  # JOB 2: BUILD APK (Hanya jalan jika Job 1 SUKSES)
  # ==============================================================
  build-android:
    name: Build Android APK
    needs: lint-csharp
    if: github.ref == 'refs/heads/production' || github.base_ref == 'production'
    runs-on: windows-latest

    permissions:
      contents: write # Izin untuk membuat Tag dan GitHub Release otomatis

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # 2. Generate Versi 3 Tingkat (YY.M.BUILD)
      - name: Generate CalVer Version
        id: get_version
        shell: pwsh
        run: |
          $yearMonth = Get-Date -Format "yy.M"
          $buildNumber = "${{ github.run_number }}"
          $fullVersion = "$yearMonth.$buildNumber"
          
          echo "app_version=$fullVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Versi APK Baru: $fullVersion"

      # 3. Setup Java JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      # 4. Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # 5. Install Workload MAUI Android
      - name: Install Workloads
        run: dotnet workload install maui-android

      # 6. Restore Dependencies
      - name: Restore Dependencies
        run: dotnet restore

      # 7. Decode Keystore dari GitHub Secrets ke nama file asli
      - name: Decode Keystore
        shell: pwsh
        run: |
          $b64 = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}".Trim()
          if ([string]::IsNullOrWhiteSpace($b64)) {
            Write-Error "Secret ANDROID_KEYSTORE_BASE64 kosong atau belum di-set di GitHub repo settings."
            exit 1
          }
          try {
            $bytes = [System.Convert]::FromBase64String($b64)
          } catch {
            Write-Error "ANDROID_KEYSTORE_BASE64 bukan string base64 yang valid."
            exit 1
          }
          [System.IO.File]::WriteAllBytes("aumo's-release-key.jks", $bytes)

      # 8. Build & Sign Android APK
      - name: Build Android APK
        run: >
          dotnet publish
          -c Release
          -f net10.0-android36.0
          -p:AndroidPackageFormat=apk
          -p:ApplicationVersion=${{ github.run_number }}
          -p:ApplicationDisplayVersion=${{ steps.get_version.outputs.app_version }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="aumo's-release-key.jks"
          -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}"
          -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}"
          -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      # 9. Hapus File Keystore Fisik dari Runner
      - name: Clean up Keystore
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "aumo's-release-key.jks") {
            Remove-Item "aumo's-release-key.jks" -Force
          }

      # 10. Upload File -Signed.apk ke GitHub Releases
      - name: Upload Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.app_version }}
          name: Aumo Release v${{ steps.get_version.outputs.app_version }}
          body: "Rilisan otomatis build ke-${{ github.run_number }} (Versi ${{ steps.get_version.outputs.app_version }})"
          files: "**/bin/Release/net10.0-android36.0/publish/*-Signed.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. Backup Artifact
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aumo-Signed-APK-v${{ steps.get_version.outputs.app_version }}
          path: "**/bin/Release/net10.0-android36.0/publish/*-Signed.apk"
          if-no-files-found: error
