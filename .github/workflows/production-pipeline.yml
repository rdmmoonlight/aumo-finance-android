name: Production Pipeline (Lint & Build APK)

on:
  push:
    branches:
      - production

concurrency:
  group: prod-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==============================================================
  # KOTAK 1: CODE QUALITY & AUTO-FIX LINTING
  # ==============================================================
  lint-and-auto-fix:
    name: 1. Auto-Fix Format & Lint C#
    runs-on: windows-latest
    permissions:
      contents: write # Wajib untuk auto-commit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install Workloads
        run: dotnet workload install maui-android

      - name: Restore Dependencies
        run: dotnet restore

      - name: Auto-Fix Code Formatting
        run: dotnet format

      - name: Commit and Push Format Changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          $status = git status --porcelain
          if ($status) {
            Write-Host "Menemukan file yang tidak rapi. Melakukan auto-commit..."
            git add .
            git commit -m "style: auto-fix C# code formatting [skip ci]"
            git push origin HEAD:production
          } else {
            Write-Host "Semua kode sudah rapi. Tidak ada perubahan."
          }

      - name: Run Static Code Analysis
        run: dotnet build --no-restore -c Debug /p:TreatWarningsAsErrors=true

  # ==============================================================
  # KOTAK 2: GENERATE CALVER VERSION
  # ==============================================================
  generate-version:
    name: 2. Generate CalVer Version
    needs: lint-and-auto-fix
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.app_version }}
    steps:
      - name: Generate Version Number
        id: get_version
        shell: pwsh
        run: |
          $yearMonth = Get-Date -Format "yy.M"
          $buildNumber = "${{ github.run_number }}"
          $fullVersion = "$yearMonth.$buildNumber"
          
          echo "app_version=$fullVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Versi APK Baru: $fullVersion"

  # ==============================================================
  # KOTAK 3: COMPILE & SIGN MAUI APK
  # ==============================================================
  build-signed-apk:
    name: 3. Compile & Sign MAUI APK
    needs: [lint-and-auto-fix, generate-version]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Decode Android Keystore Directly
        shell: pwsh
        run: |
          $b64 = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}".Trim()
          if ([string]::IsNullOrWhiteSpace($b64)) {
            Write-Error "Secret ANDROID_KEYSTORE_BASE64 kosong atau belum di-set!"
            exit 1
          }
          try {
            $bytes = [System.Convert]::FromBase64String($b64)
          } catch {
            Write-Error "ANDROID_KEYSTORE_BASE64 bukan string base64 yang valid."
            exit 1
          }
          [System.IO.File]::WriteAllBytes("aumos-release-key.jks", $bytes)

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install Workloads
        run: dotnet workload install maui-android

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build & Sign Android APK
        run: >
          dotnet publish
          -c Release
          -f net10.0-android36.0
          -p:AndroidPackageFormat=apk
          -p:ApplicationVersion=${{ github.run_number }}
          -p:ApplicationDisplayVersion=${{ needs.generate-version.outputs.app_version }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="aumos-release-key.jks"
          -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}"
          -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}"
          -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Clean up Keystore File
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "aumos-release-key.jks") {
            Remove-Item "aumos-release-key.jks" -Force
          }

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aumo-Signed-APK-v${{ needs.generate-version.outputs.app_version }}
          path: "**/bin/Release/net10.0-android36.0/publish/*-Signed.apk"
          if-no-files-found: error

  # ==============================================================
  # KOTAK 4: PUBLISH GITHUB RELEASE
  # ==============================================================
  publish-release:
    name: 4. Publish to GitHub Releases
    needs: [generate-version, build-signed-apk]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Signed APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Aumo-Signed-APK-v${{ needs.generate-version.outputs.app_version }}
          path: release-assets

      - name: Upload Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.generate-version.outputs.app_version }}
          name: Aumo Release v${{ needs.generate-version.outputs.app_version }}
          body: "Rilisan otomatis build ke-${{ github.run_number }} (Versi ${{ needs.generate-version.outputs.app_version }})"
          files: "release-assets/*-Signed.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
