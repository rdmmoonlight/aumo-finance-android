name: Build Android APK (Production)

on:
  push:
    branches:
      - production

jobs:
  build-android:
    if: github.ref == 'refs/heads/production' || github.base_ref == 'production'
    runs-on: windows-latest

    permissions:
      contents: write # Izin untuk membuat Tag dan GitHub Release otomatis

    steps:
    # 1. Checkout repository (fetch-depth: 0 wajib untuk hitung riwayat commit versi)
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Auto Versioning berdasarkan Bobot Commit
    - name: Bump Version and Push Tag
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: patch # Jika commit berupa 'fix:' -> patch, 'feat:' -> minor, 'feat!:' -> major

    # 3. Setup Java JDK 17
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    # 4. Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    # 5. Install Workload MAUI Android
    - name: Install Workloads
      run: dotnet workload install maui-android

    # 6. Inject Connection String (Menggunakan .Replace agar aman dari karakter regex/password)
    - name: Inject Connection String
      shell: pwsh
      env:
        NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      run: |
        $file = "Services/ApiService.cs"
        if (-not (Test-Path $file)) {
          Write-Error "File $file tidak ditemukan"
          exit 1
        }
        $content = Get-Content $file -Raw
        if (-not $content.Contains("__NEON_CONNECTION_STRING__")) {
          Write-Error "Placeholder __NEON_CONNECTION_STRING__ tidak ditemukan di $file"
          exit 1
        }
        
        # .Replace() literal string, aman dari karakter khusus
        $content = $content.Replace("__NEON_CONNECTION_STRING__", $env:NEON_CONNECTION_STRING)
        Set-Content -Path $file -Value $content -NoNewline
        Write-Host "Connection string berhasil di-inject."

    # 7. Restore Dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 8. Build APK Release (Menggunakan nomor versi otomatis untuk pembentukan file)
    - name: Build Android APK
      run: >
        dotnet publish
        -c Release
        -f net10.0-android
        -p:AndroidPackageFormat=apk
        -p:ApplicationVersion=${{ github.run_number }}
        -p:ApplicationDisplayVersion=${{ steps.tag_version.outputs.new_version }}

    # 9. Upload File -Signed.apk ke GitHub Releases
    - name: Upload Signed APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag_version.outputs.new_tag }}
        name: Aumo Release ${{ steps.tag_version.outputs.new_tag }}
        body: ${{ steps.tag_version.outputs.changelog }}
        files: "**/bin/Release/net10.0-android/publish/*-Signed.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 10. Backup Artifact (Hanya file -Signed.apk)
    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aumo-Signed-APK-${{ steps.tag_version.outputs.new_tag }}
        path: "**/bin/Release/net10.0-android/publish/*-Signed.apk"
        if-no-files-found: error
