name: Build Android APK (Production)

on:
  push:
    branches:
      - production

jobs:
  build-android:
    if: github.ref == 'refs/heads/production' || github.base_ref == 'production'
    runs-on: windows-latest

    permissions:
      contents: write # Izin untuk membuat GitHub Release otomatis

    steps:
    # 1. Checkout repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Java JDK 17
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    # 3. Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        include-prerelease: true

    # 4. Install Workload MAUI Android
    - name: Install Workloads
      run: dotnet workload install maui-android

    # --- Bagian baru: inject connection string ---
    - name: Inject Connection String
      shell: pwsh
      env:
        NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      run: |
        $file = "Services/ApiService.cs"
        if (-not (Test-Path $file)) {
          Write-Error "File $file tidak ditemukan"
          exit 1
        }
        $content = Get-Content $file -Raw
        if ($content -notmatch "__NEON_CONNECTION_STRING__") {
          Write-Error "Placeholder __NEON_CONNECTION_STRING__ tidak ditemukan di $file"
          exit 1
        }
        $content = $content -replace "__NEON_CONNECTION_STRING__", $env:NEON_CONNECTION_STRING
        Set-Content -Path $file -Value $content -NoNewline
        Write-Host "Connection string berhasil di-inject."
        
    # 5. Restore Dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 6. Build APK Release
    - name: Build Android APK
      run: >
        dotnet publish
        -c Release
        -f net10.0-android
        -p:AndroidPackageFormat=apk

    # 7. Upload Murni File -Signed.apk ke GitHub Releases (Sangat Direkomendasikan - Langsung .apk)
    - name: Upload Signed APK to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: release-${{ github.run_number }}
        name: Aumo Release v1.0.${{ github.run_number }}
        # Kunci hanya ke file *-Signed.apk
        files: "**/bin/Release/net10.0-android/publish/*-Signed.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 8. Backup Artifact (Hanya file -Signed.apk)
    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aumo-Signed-APK
        path: "**/bin/Release/net10.0-android/publish/*-Signed.apk"
        if-no-files-found: error
