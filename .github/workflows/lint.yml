name: Code Quality & Linting

on:
  push:
    branches:
      - main
      - production

permissions:
  contents: write # Izin untuk melakukan commit otomatis jika ada perbaikan format

jobs:
  lint-csharp:
    name: Lint & Format C# Code
    runs-on: windows-latest

    steps:
    # 1. Checkout repository dengan ref branch aktif
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    # 2. Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    # 3. Restore Dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 4. Otomatis Koreksi Format Kode (Auto-correct whitespace & style)
    - name: Auto-Format Code
      run: dotnet format

    # 5. Commit dan Push Perubahan Format Ke Production
    # Tambahkan [skip ci] agar auto-commit dari bot tidak mentrigger ulang workflow
    - name: Commit Formatted Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "style: auto-correct code formatting via dotnet format [skip ci]"

    # 6. Static Code Analysis (Build & Cek Warning/Error)
    - name: Run Static Code Analysis
      run: dotnet build --no-restore -c Debug /p:TreatWarningsAsErrors=true
