name: Copy Secrets to Target Repo

on:
  workflow_dispatch: # Dijalankan manual dari tab Actions

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Secrets to Target Repo
        uses: jaredfrayer/copy-secrets-action@v1.0.0
        with:
          target_repo: 'rdmmoonlight/aumo-mobile'
          github_token: ${{ secrets.PAT_TOKEN_REPO_TUJUAN }}
          secrets: |
            API_KEY
            DATABASE_URL
            SECRET_TOKEN
