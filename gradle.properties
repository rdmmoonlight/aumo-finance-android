# Wajib untuk seluruh dependency AndroidX yang dipakai project ini
# (androidx.core, androidx.appcompat, com.google.android.material, dst.) —
# tanpa ini build gagal di task :app:checkDebugAarMetadata dengan error
# "Configuration debugRuntimeClasspath contains AndroidX dependencies,
# but the android.useAndroidX property is not enabled".
android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
